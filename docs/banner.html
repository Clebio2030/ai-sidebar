<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif}
.wrap{width:100%;height:100%;display:flex;align-items:center;gap:52px;
  padding:0 72px;box-sizing:border-box;
  background:radial-gradient(120% 140% at 12% 0%,#2a3363 0%,#161c3a 45%,#090c1c 100%)}
.glow{position:absolute;left:40px;top:50%;transform:translateY(-50%);
  width:320px;height:320px;border-radius:50%;filter:blur(70px);
  background:radial-gradient(circle,rgba(139,108,246,.42),rgba(16,163,127,.22) 55%,transparent 72%)}
.icon{position:relative;flex-shrink:0}
.txt{position:relative;color:#eef2ff}
h1{margin:0;font-size:68px;font-weight:700;letter-spacing:-2px;line-height:1}
p{margin:16px 0 0;font-size:25px;line-height:1.4;color:#aab4d8;max-width:660px}
.tags{margin-top:26px;display:flex;flex-wrap:wrap;gap:9px}
.tag{font-size:16px;color:#cfd7f5;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);border-radius:100px;padding:6px 15px}
</style></head><body>
<div class="wrap">
  <div class="glow"></div>
  <div class="icon">
    <svg width="224" height="224" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgx" cx="0.5" cy="0.42" r="0.82">
      <stop offset="0%" stop-color="#28325f"/>
      <stop offset="100%" stop-color="#090c1c"/>
    </radialGradient>
    <linearGradient id="cox" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe0ff"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgx)"/>

  <circle cx="64" cy="30" r="20" fill="#10a37f"/>
  <circle cx="34" cy="86" r="20" fill="#4285f4"/>
  <circle cx="94" cy="86" r="20" fill="#d97757"/>

  <!-- Faisca de raio 21 e sem brilho: em 28 com halo as pontas ultrapassavam
       os circulos e viravam espetos brancos nos tamanhos pequenos. -->
  <path d="M64 43 C69.88 58.12, 69.88 58.12, 85 64
           C69.88 69.88, 69.88 69.88, 64 85
           C58.12 69.88, 58.12 69.88, 43 64
           C58.12 58.12, 58.12 58.12, 64 43 Z" fill="url(#cox)"/>
</svg>
  </div>
  <div class="txt">
    <h1>AI Sidebar</h1>
    <p>Todas as suas IAs no painel lateral do navegador &mdash; usando as assinaturas que voc&ecirc; j&aacute; paga.</p>
    <div class="tags">
      <span class="tag">ChatGPT</span><span class="tag">Claude</span><span class="tag">Gemini</span>
      <span class="tag">Grok</span><span class="tag">Copilot</span><span class="tag">Meta AI</span>
      <span class="tag">DeepSeek</span><span class="tag">Le Chat</span>
    </div>
  </div>
</div>
</body></html>
